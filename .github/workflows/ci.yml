name: CI
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Typecheck, build, test and check formatting
        run: |
          docker run --rm -e HUSKY=0 -v "$PWD:/app" -w /app oven/bun:1.4.4@sha256:1d22548f177f4ff38e0c15baa3c2c46c6c2060ba2d1bc573bb4720b407548f1d sh -c 'bun install --frozen-lockfile && bun run typecheck && bun run build && bun run test && bun run format:check'
      - name: Test deployment hooks
        run: python3 -B -m unittest discover -s deploy/site -p 'test_*.py'
      - name: Test webhook receiver
        run: node --test deploy/site/receiver/server.test.mjs
      - name: Build and start production image
        run: |
          docker build -t days-left:ci --build-arg DAYS_LEFT_REVISION="$GITHUB_SHA" .
          DAYS_LEFT_IMAGE=days-left:ci docker compose -f compose.site.yaml config --quiet
          docker network create platform-web
          trap 'DAYS_LEFT_IMAGE=days-left:ci docker compose -f compose.site.yaml down; docker network rm platform-web' EXIT
          DAYS_LEFT_IMAGE=days-left:ci docker compose -f compose.site.yaml up -d --wait --wait-timeout 60
          docker exec days-left-days-left-1 wget -qO- http://127.0.0.1:8080/healthz
          docker exec days-left-days-left-1 wget -qO- http://127.0.0.1:8080/ | grep -q 'Nearly there'
