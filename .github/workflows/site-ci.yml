name: Days Left CI
on:
  pull_request:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build, typecheck and test countdown
        run: |
          docker run --rm -v "$PWD:/app" -w /app oven/bun:1.3.14@sha256:e10577f0db68676a7024391c6e5cb4b879ebd17188ab750cf10024a6d700e5c4 sh -c 'bun install --frozen-lockfile && bun run build && bun x astro check && bun test src/lib/countdown.test.ts'
      - name: Deployment verification and rollback tests
        run: python3 -B -m unittest discover -s deploy/site -p 'test_*.py'
      - name: Webhook authentication and queue tests
        run: node --test deploy/site/receiver/server.test.mjs
      - name: Verify the production container starts without privileges
        run: |
          docker build -t days-left:ci --build-arg DAYS_LEFT_REVISION="$GITHUB_SHA" .
          DAYS_LEFT_IMAGE=days-left:ci docker compose -f compose.site.yaml config --quiet
          docker network create platform-web
          trap 'DAYS_LEFT_IMAGE=days-left:ci docker compose -f compose.site.yaml down; docker network rm platform-web' EXIT
          DAYS_LEFT_IMAGE=days-left:ci docker compose -f compose.site.yaml up -d --wait --wait-timeout 60
          docker exec days-left-days-left-1 wget -qO- http://127.0.0.1:8080/healthz
          docker exec days-left-days-left-1 wget -qO- http://127.0.0.1:8080/ | grep -q 'Nearly there'
