name: days-left
services:
  days-left:
    image: ${DAYS_LEFT_IMAGE:?set an immutable Days Left image reference}
    restart: unless-stopped
    networks:
      web:
        aliases: [days-left]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    cpus: 0.5
    pids_limit: 64
    # Inherit the health check shipped with the application image.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
networks:
  web:
    external: true
    name: ${PLATFORM_WEB_NETWORK:-platform-web}
